# Local development: docker compose up -d   →   http://localhost:8080
#
# Source is bind-mounted into the app container; Vite runs with hot reload in "node".
# Database settings below override .env, so the same .env also works outside Docker.
name: mobile-shop-pos

x-app-environment: &app-environment
  APP_ENV: local
  APP_URL: http://localhost:${APP_PORT:-8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:-mobile_shop_pos}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-pos}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}

services:
  app:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: mobile-shop-pos-app:dev
    environment: *app-environment
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /app
    # Installs its own Linux node_modules (kept in a volume, separate from the host's).
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_DOCKER: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - node-modules:/app/node_modules
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-mobile_shop_pos}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-pos}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
    # Loopback only (for a local GUI client); never reachable from the network.
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  node-modules:
